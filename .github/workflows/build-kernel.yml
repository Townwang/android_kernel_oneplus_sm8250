name: Build Kernel

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches:
      - main # 替换为你的分支名称
  pull_request:
    branches:
      - main # 替换为你的分支名称

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
    # 检出代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 下载 Neutron 工具链
    - name: Download and Setup Toolchain
      run: |
        mkdir -p ~/toolchains/clang
        wget -q https://github.com/kdrag0n/proton-clang/releases/download/20230814/neutron-clang.tar.zst -O ~/toolchain/neutron-clang.tar.zst
        sudo apt-get update && sudo apt-get install -y zstd
        tar -I zstd -xf ~/toolchain/neutron-clang.tar.zst -C ~/toolchains/clang --strip-components=1
        export PATH=~/toolchains/clang/bin:$PATH

    # 安装依赖
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev bc build-essential bison flex libelf-dev

    # 设置环境变量
    - name: Set Environment Variables
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=~/toolchains/clang/bin/aarch64-linux-gnu-
        export PATH=~/toolchains/clang/bin:$PATH

    # 编译内核
    - name: Build Kernel
      run: |
        mkdir -p out
        make O=out ARCH=arm64 defconfig
        make -j$(nproc) O=out ARCH=arm64

    # 打包生成内核
    - name: Package Kernel into ZIP
      run: |
        mkdir -p anykernel
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        zip -r9 kernel.zip anykernel/

    # 上传生成的文件
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip