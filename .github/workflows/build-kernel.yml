name: Build Kernel

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - oos13.1 # 按需调整分支
  pull_request:
    branches:
      - oos13.1 # 按需调整分支

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
    # 检出代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 下载稳定的工具链
    - name: Download Toolchain
      run: |
        mkdir -p ~/toolchains/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/platform-tools-build.tar.gz -O ~/toolchains/clang/clang.tar.gz
        tar -xf ~/toolchains/clang/clang.tar.gz -C ~/toolchains/clang
        export PATH=~/toolchains/clang/bin:$PATH

    # 安装所需依赖包
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev xz-utils bc flex bison build-essential

    # 设置环境变量
    - name: Set environment variables
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=~/toolchains/clang/bin/aarch64-linux-android-
        export PATH=~/toolchains/clang/bin:$PATH

    # 编译内核
    - name: Build Kernel
      run: |
        mkdir -p out
        make O=out ARCH=arm64 defconfig
        make -j$(nproc) O=out ARCH=arm64

    # 打包内核
    - name: Package Kernel into ZIP
      run: |
        mkdir -p anykernel
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        zip -r9 kernel.zip anykernel/

    # 上传生成的 zip 文件
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip