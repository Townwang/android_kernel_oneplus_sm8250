name: Build Kernel

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - main # 根据你的代码分支调整
  pull_request:
    branches:
      - main # 根据你的代码分支调整

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
    # 检出代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 下载 Clang 工具链
    - name: Download Toolchain
      run: |
        mkdir -p ~/toolchains/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/platform-tools-prebuilts.tar.gz -O ~/toolchains/clang/clang.tar.gz
        tar -xzf ~/toolchains/clang/clang.tar.gz -C ~/toolchains/clang
        export PATH=~/toolchains/clang/bin:$PATH

    # 设置环境变量
    - name: Set environment variables
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=~/toolchains/clang/bin/aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=~/toolchains/clang/bin/arm-linux-gnueabi-
        export PATH=~/toolchains/clang/bin:$PATH

    # 编译内核
    - name: Build Kernel
      run: |
        mkdir -p out
        make O=out ARCH=arm64 defconfig
        make -j$(nproc) O=out ARCH=arm64

    # 打包内核
    - name: Package Kernel into ZIP
      run: |
        mkdir -p anykernel
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        zip -r9 kernel.zip anykernel/

    # 上传内核 ZIP 文件
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel.zip